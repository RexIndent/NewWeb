<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="sky"></canvas>
<svg id="const" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<div id="dream"></div><div id="soil"></div><canvas id="nc"></canvas><canvas id="fx"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="warp" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".008 .02" numOctaves="2" seed="3"/><feDisplacementMap id="wd" in="SourceGraphic" scale="0"/></filter></svg>

<div id="loader"><div class="orb"><i class="ring"></i><i class="ring b"></i><span id="pct">0%</span></div><div>Gathering the light…</div></div>

<div id="bf" aria-hidden="true"><svg viewBox="-32 -32 64 64"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fe9ff"/><stop offset="1" stop-color="#ff7eb6"/></linearGradient></defs>
<g class="w"><path class="p" d="M0 0C-8-22-30-24-26-6C-24 4-10 6 0 2Z"/><path class="p" d="M0 2C-6 8-22 20-14 26C-8 28-2 14 0 2Z"/></g>
<g class="w" style="animation-name:flap"><path class="p" d="M0 0C8-22 30-24 26-6C24 4 10 6 0 2Z"/><path class="p" d="M0 2C6 8 22 20 14 26C8 28 2 14 0 2Z"/></g>
<path d="M0-8V16" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>

<main id="front">
  <header class="hero">
    <span>Portfolio · 2026</span>
    <h1 class="mag" id="name"></h1>
    <p class="mag">Creative developer drifting between code, light and open sky.</p>
    <div class="hint">Scroll to find the archways</div>
  </header>
  <section id="gate">
    <h2 class="mag">Choose an archway</h2>
    <nav class="portals" aria-label="Sections">
      <button class="archway-portal" data-id="about"><span class="arch-stone"><span class="arch-glow"></span></span>About</button>
      <button class="archway-portal" data-id="skills"><span class="arch-stone"><span class="arch-glow"></span></span>Skills</button>
      <button class="archway-portal" data-id="values"><span class="arch-stone"><span class="arch-glow"></span></span>Values</button>
      <button class="archway-portal" data-id="interests"><span class="arch-stone"><span class="arch-glow"></span></span>Interests</button>
      <button class="archway-portal" data-id="connect"><span class="arch-stone"><span class="arch-glow"></span></span>Connect</button>
    </nav>
  </section>
  <section id="zone" aria-label="Closing quote">
    <div id="stage">
      <canvas id="grand" aria-hidden="true"></canvas>
      <footer class="copy" id="copy"></footer>
    </div>
  </section>
</main>

<button id="back">✦ Return to Horizon ✦</button>
<button class="nav" id="prev" aria-label="Previous archway">‹</button><button class="nav" id="next" aria-label="Next archway">›</button><button id="theme" aria-label="Toggle dark mode">☾</button>
<div id="portal">
  <!-- ABOUT: author photo + facts. Filled from DATA.me. The <img> src is generated as an inline SVG so no asset can break; swap data-src for a real file. -->
  <section class="about-front" id="about"><h2 class="mag">About Me</h2>
    <div class="about">
      <img class="author-photo" id="author" alt="Author Photo" data-src="placeholder-author.jpg" data-magnify="butterfly">
      <div><dl class="facts" id="facts"></dl><p class="mag" id="bio"></p></div>
    </div></section>
  <!-- SKILLS: exactly 5 sets (DATA.skills). Each .card holds one .skill-photo-placeholder (5 total) + tag list. CSS grid auto-fit keeps it responsive. -->
  <section class="sec" id="sec-skills"><h2 class="mag">Skills</h2><div class="grid" id="skills-grid"></div></section>
  <!-- VALUES: exactly 3 sets (DATA.values), heading + blurb each. -->
  <section class="sec" id="sec-values"><h2 class="mag">Values</h2><div class="grid" id="values-grid"></div></section>
  <!-- INTERESTS: exactly 3 sets (DATA.interests), each with an .interest-photo-placeholder. -->
  <section class="sec" id="sec-interests"><h2 class="mag">Interests</h2><div class="grid" id="interests-grid"></div></section>
  <!-- CONNECT: Email, Facebook, GitHub, TikTok. Replace hrefs with your own profiles. -->
  <section class="sec" id="sec-connect"><h2 class="mag">Connect</h2><ul class="soc" id="soc"></ul></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
